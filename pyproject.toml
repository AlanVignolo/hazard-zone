[project]
name = "hazard-zone"
version = "0.1.0"
description = "Edge AI hazard zone monitor for machinery: camera -> YOLO -> CAN"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed on the Jetson only. python-can needs a Linux SocketCAN backend.
device = [
    "python-can>=4.2",
]

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires a real camera, CAN interface or GPU (skipped by default)",
]
addopts = "-m 'not hardware'"

[tool.hatch.build.targets.wheel]
packages = ["hazard_zone"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import ordering
    "UP",  # pyupgrade
    "B",   # flake8-bugbear: likely bugs
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[fool.mypy]
python_version = "3.8"
# Gradual mode: catch the errors that matter without fighting untyped C
# bindings. strict would demand annotations everywhere, including for numpy
# and GStreamer, for little gain.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
# These ship no type information, and insisting on it produces noise rather
# than findings.
module = ["gi.*", "cv2.*", "numpy.*", "can.*"]
ignore_missing_imports = true
